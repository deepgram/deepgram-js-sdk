name: ci
permissions:
  contents: read
# `push` is narrowed to the default branch: for any branch with an open PR the
# `pull_request` event already covers it, and `on: [push, pull_request]` ran the
# whole workflow twice per push — doubling real API spend in the `examples` job.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up node
        uses: actions/setup-node@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-optional=false

      - name: Compile
        run: make build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          retention-days: 1

  examples:
    runs-on: ubuntu-latest
    needs: compile
    # Skipped on fork PRs: GitHub withholds repository secrets there, so every
    # example would make unauthenticated calls and `make examples` would exit 1 on
    # a contributor's PR for reasons they cannot diagnose or fix. Do NOT switch to
    # `pull_request_target` to get secrets back — that runs fork-authored code with
    # this repo's secrets and would expose DG_TOKEN.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up node
        uses: actions/setup-node@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-optional=false

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Run examples
        run: make examples
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DG_TOKEN }}
          DEEPGRAM_PROJECT_ID: ${{ secrets.DG_PROJECT_ID }}

  test:
    runs-on: ubuntu-latest
    needs: compile
    # Read-only on purpose. This job installs and executes pull-request-authored
    # code and hands the Cobertura XML to a third-party container action, so it
    # must not hold a token that can mutate the PR. Commenting happens in
    # `coverage-comment`, which never checks out or runs any of that code.
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          # Nothing here talks to the GitHub API. Leaving the job token in
          # .git/config would hand it to every script the PR can run.
          persist-credentials: false

      - name: Set up node
        uses: actions/setup-node@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-optional=false

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Typecheck tests (compat-alias / regen safety nets)
        run: make typecheck-tests

      - name: Test with coverage
        id: coverage
        # Failure is deferred to the final step of this job so that a blown
        # coverage threshold still produces a report saying which packages fell
        # short. Without this the summary steps below are skipped and the only
        # feedback is "No coverage report generated."
        continue-on-error: true
        run: make test-coverage

      - name: Test ESM
        run: make test-esm

      - name: Generate code coverage summary
        # Pinned to a commit SHA rather than a tag: a mutable tag can be
        # repointed at new code with no commit here. Note the action still
        # delegates to the `codecoveragesummary:v1.3.0` image, so this step is
        # treated as untrusted execution and kept in this read-only job.
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        # `always()` drops the implicit success() guard so the report is still
        # generated when the coverage gate fails — which is exactly when someone
        # needs to read it.
        if: always() && hashFiles('coverage/cobertura-coverage.xml') != ''
        with:
          filename: coverage/cobertura-coverage.xml
          badge: true
          format: markdown
          hide_complexity: true
          indicators: true
          # Must track the `coverage.thresholds` in vitest.config.mts. The action
          # default is 50/75, which would paint a green ✔ on a package sitting at
          # 75% while `make test-coverage` fails the build at 95%.
          thresholds: "95 95"
          output: both

      - name: Upload coverage report
        # Handed to `coverage-comment`, which has the write token but never runs
        # PR code.
        if: always() && hashFiles('code-coverage-results.md') != ''
        uses: actions/upload-artifact@v6
        with:
          name: code-coverage-results
          path: code-coverage-results.md
          retention-days: 1

      - name: Write coverage to job summary
        if: always()
        run: '[ -f code-coverage-results.md ] && cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY" || echo "No coverage report generated." >> "$GITHUB_STEP_SUMMARY"'

      - name: Fail on test or coverage failure
        # Re-raises the deferred `make test-coverage` status now that the report
        # has been published, so the job still goes red.
        if: always() && steps.coverage.outcome == 'failure'
        run: |
          echo "::error::make test-coverage failed — see the coverage report in the job summary." >&2
          exit 1

  coverage-comment:
    runs-on: ubuntu-latest
    needs: test
    # Deliberately has no `actions/checkout` step and runs no repository code: it
    # only downloads the Markdown that `test` produced and posts it. That is why
    # it is the only job allowed `pull-requests: write`.
    #
    # `always()` so the comment is posted even when the coverage gate failed.
    # Same-repository PRs only — fork PRs get a read-only GITHUB_TOKEN no matter
    # what `permissions:` requests, and must never be run via
    # `pull_request_target` to get around that.
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      # Read-only, and only so the artifact download can reach this run.
      actions: read
      pull-requests: write
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v7
        # A failed `compile` (or a coverage run that produced no XML) means there
        # is no artifact; that is not a reason to fail this job.
        continue-on-error: true
        with:
          name: code-coverage-results

      - name: Add coverage PR comment
        if: hashFiles('code-coverage-results.md') != ''
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: code-coverage
          # No `recreate: true` — that deletes and reposts, notifying every PR
          # subscriber on each push. `header` alone is what makes the comment sticky,
          # so it updates in place.
          path: code-coverage-results.md

  test-browser:
    runs-on: ubuntu-latest
    needs: compile
    # Same reason as `examples`: tests/browser/setup.ts throws outright without
    # DEEPGRAM_API_KEY, which fork PRs never receive.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up node
        uses: actions/setup-node@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-optional=false

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Run browser tests
        run: make browser
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DG_TOKEN }}
          DEEPGRAM_PROJECT_ID: ${{ secrets.DG_PROJECT_ID }}
